name: Send MB Review Reports

on:
  schedule:
    - cron: '0 1 * * 1-5'  # 週一至週五 UTC 01:00（台灣時間早上 9 點）
  workflow_dispatch:       # 允許在 GitHub UI 手動觸發

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all region pipelines
        run: bash run_all.sh
        env:
          EMAIL_SENDER:           ${{ vars.EMAIL_SENDER }}
          EMAIL_PASSWORD:         ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT_NEWEGG: ${{ vars.EMAIL_RECIPIENT_NEWEGG }}
          EMAIL_RECIPIENT_KAKAKU: ${{ vars.EMAIL_RECIPIENT_KAKAKU }}
          EMAIL_RECIPIENT_DANAWA: ${{ vars.EMAIL_RECIPIENT_DANAWA }}

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add motherboard_reviews.json kakaku_reviews.json danawa_reviews.json
          git diff --staged --quiet || git commit -m "chore: update market data [skip ci]"
          git push
